name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Installs Gradle and puts it on PATH, so the repo does not need a gradle wrapper.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: moto-gps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publishes the APK as a direct download (no zip) at a fixed link:
      # https://github.com/<owner>/<repo>/releases/latest/download/moto-gps.apk
      - name: Publish APK to the "latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk moto-gps.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest moto-gps.apk \
            --target "${{ github.sha }}" \
            --title "ไมล์ GPS (build ${{ github.run_number }})" \
            --notes "Debug APK built from commit ${{ github.sha }}" \
            --latest
