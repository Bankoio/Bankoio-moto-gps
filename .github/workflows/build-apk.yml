name: Build JamenoyConnect APK

on:
  push:
    branches: [jamenoy-connect]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare preinstalled Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk JamenoyConnect.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JamenoyConnect-apk
          path: JamenoyConnect.apk

      - name: Commit APK back to this branch
        run: |
          mkdir -p dist
          cp JamenoyConnect.apk dist/JamenoyConnect.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f dist/JamenoyConnect.apk
          git commit -m "Add built APK [skip ci]"
          git push
