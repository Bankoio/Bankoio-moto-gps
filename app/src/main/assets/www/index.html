<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ไมล์ GPS</title>
<style>
/* Look: flat black screen, one big arc gauge (0-240) whose band fades from a bright outer edge to a dark
   inner edge, big white number in the middle, trip distance under the gauge, average / max at the bottom.
   Tap the gauge to change its color. System fonts only, so it works offline. */
:root {
  --bg: #000;
  --panel: #0e0e12;
  --ink: #fff;
  --muted: #9a9aa2;
  --line: #26262e;
  --warn: #ffb224;
  --over: #ff5560;
  /* gauge colors: the script rewrites these when the color changes (these are the red defaults).
     --r*: band not yet reached, inner edge to outer edge. --f*: band already covered by the needle. */
  --r0: #5a0a14; --r1: #6e0c18; --r2: #c91d2c; --r3: #ff2f40; --r4: #ff4a56;
  --f0: #6a1208; --f1: #8a1410; --f2: #e0262a; --f3: #ff4a2c; --f4: #ff8a3a; --f5: #ffc66c;
  --glow: rgba(135, 0, 16, 0.75);
  --rim: #ff5a64;
  --accent: #ff3b47;
  --body: -apple-system, system-ui, "SF Pro Display", "Segoe UI", Roboto, "Noto Sans Thai", "Sarabun", sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  user-select: none; -webkit-user-select: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px; }

.app {
  max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  min-height: calc(100vh - 28px);
}

/* top bar: share | reset */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; }
.icon-btn, .text-btn { background: none; border: 0; cursor: pointer; color: var(--ink); }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; }
.icon-btn svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.text-btn { min-width: 44px; min-height: 44px; padding: 0 4px; font-size: 1.2rem; font-weight: 500; }

.layout {
  flex: 1; display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr);
  grid-template-rows: 1fr auto auto; grid-template-areas: "dash" "stats" "controls";
}
.dash { grid-area: dash; align-self: center; } .stats { grid-area: stats; } .controls { grid-area: controls; }
@media (min-width: 700px) and (orientation: landscape) {
  .layout {
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    grid-template-rows: 1fr 1fr; grid-template-areas: "dash stats" "dash controls";
  }
  .stats { align-self: end; } .controls { align-self: start; }
}

/* gauge */
.dash { display: grid; justify-items: center; }
.gauge {
  position: relative;
  container-type: inline-size;
  width: min(100%, 460px, calc((100vh - 200px) * 320 / 300));
  aspect-ratio: 320 / 300;
  cursor: pointer;
}
@media (min-width: 700px) and (orientation: landscape) {
  .gauge { width: min(100%, 460px, calc((100vh - 100px) * 320 / 300)); }
}
.gauge svg { display: block; width: 100%; height: 100%; overflow: visible; }
.track { fill: none; stroke: url(#gBand); stroke-width: 56; }
.prog { fill: none; stroke: url(#gFill); stroke-width: 56; }
.rimtrack { fill: none; stroke: var(--rim); stroke-opacity: 0.4; stroke-width: 1.5; }
.rim { fill: none; stroke: var(--ink); stroke-width: 2; }
.ringbottom { fill: none; stroke: var(--line); stroke-width: 2; opacity: 0.8; }
.gloss { fill: none; stroke: var(--ink); stroke-opacity: 0.2; stroke-width: 3; stroke-linecap: round; filter: blur(1.2px); }
.tick { stroke: var(--bg); stroke-width: 1.6; }
.endlabel { fill: var(--ink); font: 700 17px var(--body); text-anchor: middle; dominant-baseline: central; }
.limit-mark { stroke: var(--warn); stroke-width: 4; stroke-linecap: round; }
.needle { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(255, 255, 255, 0.6)); }

.unit, .speed, .trip { position: absolute; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; text-align: center; pointer-events: none; }
.unit { top: 30%; font-size: 1.15rem; font-size: clamp(0.8rem, 5cqw, 1.2rem); font-weight: 600; color: var(--ink); line-height: 1.2; }
.speed {
  top: 53.3%;
  font-weight: 700;
  font-size: clamp(3.5rem, 20vw, 7rem);
  font-size: 21cqw;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.trip { top: 93.5%; color: var(--muted); font-size: 1.1rem; font-size: clamp(0.85rem, 5cqw, 1.25rem); font-weight: 500; font-variant-numeric: tabular-nums; }
body[data-zone="warn"] .speed { color: var(--warn); }
body[data-zone="over"] .speed { color: var(--over); }
@media (prefers-reduced-motion: no-preference) {
  body[data-zone="over"] .speed { animation: pulse 0.5s ease-in-out infinite alternate; }
}
@keyframes pulse { from { opacity: 1; } to { opacity: 0.55; } }

.flash {
  position: fixed; inset: 0; pointer-events: none; z-index: 5;
  border: 6px solid var(--over); opacity: 0; transition: opacity 0.15s;
}
body[data-zone="over"] .flash { opacity: 1; }

/* short label shown when the color changes */
.toast {
  position: fixed; left: 50%; top: 16%; transform: translateX(-50%); z-index: 6; pointer-events: none;
  padding: 8px 18px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  font-weight: 600; opacity: 0; transition: opacity 0.2s;
}
.toast.show { opacity: 1; }
.toast i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; vertical-align: -1px; background: var(--rim); }

/* average / max */
.stats { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: center; padding-top: 8px; }
.stat { display: grid; gap: 0; min-width: 0; }
.stat dt { color: var(--muted); font-size: 0.95rem; font-weight: 700; line-height: 1.4; letter-spacing: 0.02em; }
.stat dd { margin: 0; font-size: 1.45rem; font-weight: 500; line-height: 1.3; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* status (GPS starts by itself, so there is no start / stop button) */
.controls { display: grid; gap: 10px; }
.status { margin: 0; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 0.88rem; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.status[data-kind="search"] .dot { background: var(--warn); }
.status[data-kind="live"] .dot { background: #25d3b5; }
.status[data-kind="err"] .dot { background: var(--over); }
#statusText { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.time { font-variant-numeric: tabular-nums; white-space: nowrap; }
.gps { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; white-space: nowrap; }
.bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
.bars i { width: 4px; border-radius: 1px; background: var(--line); }
.bars i:nth-child(1) { height: 5px; }
.bars i:nth-child(2) { height: 8px; }
.bars i:nth-child(3) { height: 12px; }
.bars i:nth-child(4) { height: 16px; }
.bars i.on { background: #25d3b5; }
.bars.lv1 i.on { background: var(--over); }
.bars.lv2 i.on { background: var(--warn); }

.notice {
  margin: 0; padding: 12px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5;
  background: var(--panel); border: 1px solid var(--line);
}
.notice[data-kind="err"] { border-color: var(--over); }
.notice[data-kind="warn"] { border-color: var(--warn); }
.notice button {
  display: block; margin-top: 10px; min-height: 44px; padding: 0 20px; border-radius: 999px;
  border: 2px solid var(--accent); background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
}
.safety { margin: 0; color: var(--muted); font-size: 0.78rem; text-align: center; }
</style>
</head>
<body>
<div class="flash" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <button class="icon-btn" id="shareBtn" type="button" aria-label="แชร์สรุปทริป">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4M7 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-2"/></svg>
    </button>
    <button class="text-btn" id="resetBtn" type="button">Reset</button>
  </header>

  <main class="layout">
    <section class="dash" aria-label="ความเร็วปัจจุบัน">
      <div class="gauge" id="gauge" title="แตะเพื่อเปลี่ยนสี">
        <svg viewBox="0 0 320 300" role="img" aria-label="มาตรวัดความเร็ว 0 ถึง 240 กิโลเมตรต่อชั่วโมง แตะเพื่อเปลี่ยนสี">
          <defs>
            <!-- brightness across the band: transparent at the inner edge (r=84) up to bright at the outer edge (r=140) -->
            <radialGradient id="gBand" gradientUnits="userSpaceOnUse" cx="160" cy="160" r="140">
              <stop offset="0.6" style="stop-color:var(--r0)" stop-opacity="0"/>
              <stop offset="0.68" style="stop-color:var(--r1)" stop-opacity="0.7"/>
              <stop offset="0.82" style="stop-color:var(--r2)"/>
              <stop offset="0.93" style="stop-color:var(--r3)"/>
              <stop offset="1" style="stop-color:var(--r4)"/>
            </radialGradient>
            <radialGradient id="gFill" gradientUnits="userSpaceOnUse" cx="160" cy="160" r="140">
              <stop offset="0.6" style="stop-color:var(--f0)" stop-opacity="0"/>
              <stop offset="0.68" style="stop-color:var(--f1)" stop-opacity="0.75"/>
              <stop offset="0.8" style="stop-color:var(--f2)"/>
              <stop offset="0.9" style="stop-color:var(--f3)"/>
              <stop offset="0.96" style="stop-color:var(--f4)"/>
              <stop offset="1" style="stop-color:var(--f5)"/>
            </radialGradient>
            <radialGradient id="gGlow" gradientUnits="userSpaceOnUse" cx="160" cy="160" r="90">
              <stop offset="0" style="stop-color:var(--glow)"/>
              <stop offset="1" style="stop-color:var(--glow);stop-opacity:0"/>
            </radialGradient>
          </defs>
          <circle cx="160" cy="160" r="90" fill="url(#gGlow)"/>
          <path id="track" class="track" d=""/>
          <path id="prog" class="prog" d=""/>
          <g id="ticks"></g>
          <path id="rimTrack" class="rimtrack" d=""/>
          <path id="rim" class="rim" d=""/>
          <path id="ringBottom" class="ringbottom" d=""/>
          <path id="gloss" class="gloss" d=""/>
          <line id="limitMark" class="limit-mark" x1="0" y1="0" x2="0" y2="0"/>
          <line id="needle" class="needle" x1="0" y1="0" x2="0" y2="0"/>
        </svg>
        <div class="unit">km/h</div>
        <div class="speed" id="speed">--</div>
        <div class="trip"><span id="dist">0.00</span> km</div>
      </div>
    </section>

    <dl class="stats">
      <div class="stat"><dt>AVG. SPEED</dt><dd><span id="avg">0</span> km/h</dd></div>
      <div class="stat"><dt>MAX. SPEED</dt><dd><span id="max">0</span> km/h</dd></div>
    </dl>

    <div class="controls">
      <p class="notice" id="notice" role="alert" hidden><span id="noticeText"></span><button id="retryBtn" type="button" hidden>ลองอีกครั้ง</button></p>
      <p class="status" id="status" data-kind="idle" role="status">
        <span class="dot"></span><span id="statusText">กำลังเริ่ม…</span>
        <span class="time" id="time">0:00:00</span>
        <span class="gps" title="ความแม่นยำของสัญญาณ GPS">
          <span class="bars" id="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span id="gpsText">GPS</span>
        </span>
      </p>
      <p class="safety">ไม่ควรมองหน้าจอขณะขับขี่</p>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript>ต้องเปิดใช้งาน JavaScript เพื่อใช้แอปนี้</noscript>

<script>
(function () {
  'use strict';

  // ==ENGINE-START==
  const VMAX = 240;
  const MOVE_KMH = 3;

  function haversine(lat1, lon1, lat2, lon2) {
    const R = 6371000, r = Math.PI / 180;
    const dLa = (lat2 - lat1) * r, dLo = (lon2 - lon1) * r;
    const s = Math.sin(dLa / 2) ** 2 + Math.cos(lat1 * r) * Math.cos(lat2 * r) * Math.sin(dLo / 2) ** 2;
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  function createTrip() {
    return { dist: 0, moving: 0, max: 0, disp: 0, last: null, hist: [], fixes: 0 };
  }

  // keep the last ~5 s of fixes: a longer baseline averages out GPS jitter when there is no Doppler speed
  function remember(t, f) {
    t.last = f;
    t.hist.push(f);
    while (t.hist.length && f.t - t.hist[0].t > 5000) t.hist.shift();
  }

  function avgKmh(t) {
    return t.moving > 0 ? (t.dist / 1000) / (t.moving / 3600) : 0;
  }

  // f = { lat, lon, acc (m), speed (m/s or null), t (ms) }. Returns true when the fix was used.
  function processFix(t, f) {
    if (!(f.acc <= 100)) return false;                      // too inaccurate, ignore
    if (t.last && f.t - t.last.t > 15000) { t.last = null; t.hist = []; }  // long gap: new segment
    if (t.last && f.t <= t.last.t) return false;            // out of order
    const prev = t.last;
    const dt = prev ? (f.t - prev.t) / 1000 : 0;
    const d = prev ? haversine(prev.lat, prev.lon, f.lat, f.lon) : 0;
    const hasSpeed = f.speed != null && isFinite(f.speed) && f.speed >= 0;

    let raw;
    if (hasSpeed) {
      raw = f.speed * 3.6;
    } else if (prev && dt >= 0.5) {
      // movement smaller than the GPS noise counts as standing still
      const base = t.hist.length ? t.hist[0] : prev;
      const bdt = (f.t - base.t) / 1000;
      const bd = haversine(base.lat, base.lon, f.lat, f.lon);
      raw = bd < Math.max(3, f.acc * 0.8) ? 0 : (bd / bdt) * 3.6;
    } else {
      remember(t, f);
      return false;
    }
    if (raw > 250) return false;                            // implausible spike
    if (raw < 2) raw = 0;

    t.disp = (raw === 0 && t.disp < 3) ? 0 : t.disp + (raw - t.disp) * (raw === 0 ? 0.7 : 0.55);

    if (prev && raw >= MOVE_KMH && f.acc <= 30) {
      t.moving += dt;
      t.dist += hasSpeed ? (raw / 3.6) * dt : d;
    }
    if (f.acc <= 30 && t.fixes >= 2 && t.disp > t.max) t.max = t.disp;
    t.fixes++;
    remember(t, f);
    return true;
  }

  function fmtTime(sec) {
    const s = Math.max(0, Math.floor(sec));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60;
    return h + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0');
  }

  function signalLevel(acc) {
    if (acc <= 10) return { bars: 4, label: 'ดีมาก' };
    if (acc <= 20) return { bars: 3, label: 'ดี' };
    if (acc <= 40) return { bars: 2, label: 'พอใช้' };
    return { bars: 1, label: 'อ่อน' };
  }
  // ==ENGINE-END==

  // Speed limit for the alert: the number turns amber from 90% of it and red above it, with a beep and vibration.
  const LIMIT = 200;
  // Testing aid only (no screen for it): open the page with ?sim=<peak km/h> to run a built-in simulated trip.
  const params = new URLSearchParams(location.search);
  const SIM = params.has('sim');
  const SIM_TOP = Number(params.get('sim')) > 20 ? Number(params.get('sim')) : 145;

  // gauge colors: tap the gauge to go to the next one. h = base hue, d = which way the covered band shifts
  // (toward yellow for red / orange / purple-pink, toward cyan or lime for blue / green).
  const COLORS = [
    { name: 'แดง', h: 355, d: 1 },
    { name: 'ส้ม', h: 24, d: 1 },
    { name: 'เขียว', h: 145, d: -1 },
    { name: 'ฟ้า', h: 210, d: -1 },
    { name: 'ม่วง', h: 275, d: 1 },
    { name: 'ชมพู', h: 325, d: -1 }
  ];

  // ---------- gauge geometry (one scale for band, ticks, labels, needle and limit mark) ----------
  // The band is a thick stroke along radius RM (inner edge RIN, outer edge ROUT); RR is the thin rim outside it.
  const CX = 160, CY = 160, RM = 112, RIN = 84, ROUT = 140, RR = 141.5, A0 = 135, SWEEP = 270;
  const ang = v => A0 + SWEEP * Math.min(Math.max(v, 0), VMAX) / VMAX;
  const pt = (a, r) => [CX + r * Math.cos(a * Math.PI / 180), CY + r * Math.sin(a * Math.PI / 180)];
  const f2 = n => n.toFixed(2);
  function arcPath(a1, a2, r) {
    const p1 = pt(a1, r), p2 = pt(a2, r);
    const large = (a2 - a1) > 180 ? 1 : 0;
    return 'M' + f2(p1[0]) + ' ' + f2(p1[1]) +
      ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + f2(p2[0]) + ' ' + f2(p2[1]);
  }
  function setLine(line, a, r1, r2) {
    const p1 = pt(a, r1), p2 = pt(a, r2);
    line.setAttribute('x1', f2(p1[0])); line.setAttribute('y1', f2(p1[1]));
    line.setAttribute('x2', f2(p2[0])); line.setAttribute('y2', f2(p2[1]));
  }

  const $ = id => document.getElementById(id);
  const el = {
    speed: $('speed'), prog: $('prog'), track: $('track'), rim: $('rim'), rimTrack: $('rimTrack'),
    ringBottom: $('ringBottom'), gloss: $('gloss'), ticks: $('ticks'), needle: $('needle'), limitMark: $('limitMark'),
    gauge: $('gauge'), toast: $('toast'),
    status: $('status'), statusText: $('statusText'), notice: $('notice'),
    max: $('max'), avg: $('avg'), dist: $('dist'), time: $('time'),
    reset: $('resetBtn'), retry: $('retryBtn'), noticeText: $('noticeText'), bars: $('bars'), gpsText: $('gpsText'),
    share: $('shareBtn')
  };

  // ---------- preferences (only the gauge color is remembered) ----------
  const PREF_KEY = 'moto-gps-prefs-v1';
  const prefs = { color: 0 };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch (e) { /* ignore */ }
  if (!(prefs.color >= 0 && prefs.color < COLORS.length)) prefs.color = 0;
  function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ } }

  // ---------- run state ----------
  let trip = createTrip();
  let running = false, hasFix = false, watchId = null, simTimer = null;
  let elapsed = 0, tickAt = 0, lastBeep = 0, audioCtx = null, wakeLock = null, noticeKind = null, toastTimer = null;

  // ---------- gauge color ----------
  const hsl = (h, s, l) => 'hsl(' + (((h % 360) + 360) % 360) + ', ' + s + '%, ' + l + '%)';
  function applyColor() {
    const c = COLORS[prefs.color], h = c.h, d = c.d, root = document.documentElement.style;
    const set = (k, v) => root.setProperty(k, v);
    // not yet reached: inner edge (fades out) to bright outer edge
    set('--r0', hsl(h, 85, 18)); set('--r1', hsl(h, 85, 24)); set('--r2', hsl(h, 75, 44));
    set('--r3', hsl(h, 100, 59)); set('--r4', hsl(h, 100, 64));
    // covered by the needle: same, but the outer edge glows toward a second hue
    set('--f0', hsl(h, 80, 22)); set('--f1', hsl(h + d * 5, 80, 29)); set('--f2', hsl(h + d * 4, 76, 51));
    set('--f3', hsl(h + d * 13, 100, 58)); set('--f4', hsl(h + d * 29, 100, 61)); set('--f5', hsl(h + d * 42, 100, 71));
    set('--glow', 'hsla(' + h + ', 100%, 26%, 0.75)');
    set('--rim', hsl(h, 100, 68));
    set('--accent', hsl(h, 100, 62));
  }
  function nextColor() {
    prefs.color = (prefs.color + 1) % COLORS.length;
    savePrefs();
    applyColor();
    el.toast.innerHTML = '<i></i>';
    el.toast.appendChild(document.createTextNode('สี' + COLORS[prefs.color].name));
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove('show'), 1300);
  }

  function drawStatic() {
    el.track.setAttribute('d', arcPath(A0, A0 + SWEEP, RM));
    el.rimTrack.setAttribute('d', arcPath(A0, A0 + SWEEP, RR));
    el.ringBottom.setAttribute('d', arcPath(A0 + SWEEP, A0 + 360, RR));   // faint ring through the opening
    el.gloss.setAttribute('d', arcPath(72, 108, 137));
    setLine(el.limitMark, ang(LIMIT), ROUT + 6, ROUT + 16);
    const NS = 'http://www.w3.org/2000/svg';
    // dividers every 20 km/h cut the band into segments
    for (let v = 20; v < VMAX; v += 20) {
      const ln = document.createElementNS(NS, 'line');
      ln.setAttribute('class', 'tick');
      setLine(ln, ang(v), RIN - 1, ROUT + 1);
      el.ticks.appendChild(ln);
    }
    [[0, A0 + 9], [VMAX, A0 + SWEEP - 9]].forEach(function (e) {
      const p = pt(e[1], RM);
      const tx = document.createElementNS(NS, 'text');
      tx.setAttribute('class', 'endlabel');
      tx.setAttribute('x', f2(p[0])); tx.setAttribute('y', f2(p[1]));
      tx.textContent = String(e[0]);
      el.ticks.appendChild(tx);
    });
  }

  function zoneOf(shown) {
    return shown > LIMIT ? 'over' : (shown >= LIMIT * 0.9 ? 'warn' : 'ok');
  }

  // ---------- alerts ----------
  function beep() {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
      o.type = 'square'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.4);
    } catch (e) { /* ignore */ }
  }
  function alerts(zone) {
    if (zone !== 'over' || !running) { lastBeep = 0; return; }
    const now = Date.now();
    if (now - lastBeep >= 2500) {
      lastBeep = now;
      beep();
      if (navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch (e) { /* ignore */ } }
    }
  }

  // ---------- rendering ----------
  function render() {
    const v = trip.disp;
    const shown = Math.round(v);
    el.speed.textContent = hasFix ? String(shown) : '--';
    const filled = hasFix && v > 0.5;
    el.prog.setAttribute('d', filled ? arcPath(A0, ang(v), RM) : '');
    el.rim.setAttribute('d', filled ? arcPath(A0, ang(v), RR) : '');
    setLine(el.needle, ang(hasFix ? v : 0), 96, ROUT + 2);
    const zone = hasFix ? zoneOf(shown) : 'ok';
    document.body.dataset.zone = zone;
    el.max.textContent = String(Math.round(trip.max));
    el.avg.textContent = String(Math.round(avgKmh(trip)));
    const km = trip.dist / 1000;
    el.dist.textContent = km < 10 ? km.toFixed(2) : km.toFixed(1);
    el.time.textContent = fmtTime(elapsed);
    alerts(zone);
  }

  function setStatus(kind, text) {
    el.status.dataset.kind = kind;
    el.statusText.textContent = text;
  }
  function updateUI() {
    if (running && !hasFix) setStatus('search', SIM ? 'โหมดจำลอง กำลังเริ่ม…' : 'กำลังค้นหาสัญญาณ GPS…');
    else if (running) setStatus('live', SIM ? 'บันทึกทริป (จำลอง)' : 'กำลังบันทึกทริป');
    else setStatus('idle', 'GPS หยุดอยู่ จะเริ่มเองเมื่อเปิดแอป');
  }
  function showNotice(kind, text, canRetry) {
    noticeKind = kind;
    el.notice.dataset.kind = kind;
    el.noticeText.textContent = text;
    el.retry.hidden = !canRetry;
    el.notice.hidden = false;
  }
  function hideNotice() { noticeKind = null; el.notice.hidden = true; }
  function flashNotice(text) {
    showNotice('info', text);
    setTimeout(function () { if (noticeKind === 'info') hideNotice(); }, 3000);
  }

  function setSignal(acc) {
    const s = signalLevel(acc);
    el.bars.className = 'bars lv' + s.bars;
    Array.prototype.forEach.call(el.bars.children, (b, i) => b.classList.toggle('on', i < s.bars));
    el.gpsText.textContent = '±' + Math.round(acc) + ' ม.';
    el.gpsText.parentNode.title = 'ความแม่นยำของสัญญาณ GPS: ' + s.label;
  }

  // ---------- GPS input ----------
  function handleFix(f) {
    setSignal(f.acc);
    if (f.acc <= 100) {
      if (!hasFix) { hasFix = true; updateUI(); }
      if (noticeKind === 'warn') hideNotice();
    } else if (noticeKind !== 'warn') {
      showNotice('warn', 'สัญญาณ GPS ยังไม่แม่นพอ (คลาดเคลื่อนเกิน 100 เมตร) ลองออกไปที่โล่ง');
    }
    processFix(trip, f);
    render();
  }
  function onPos(p) {
    handleFix({
      lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy,
      speed: p.coords.speed, t: p.timestamp
    });
  }
  function onErr(e) {
    if (e.code === 1) {
      stop();
      showNotice('err', 'ไม่ได้รับอนุญาตให้ใช้ตำแหน่ง กด "ลองอีกครั้ง" แล้วเลือกอนุญาต ถ้าไม่มีหน้าต่างถามขึ้นมา ให้เปิดสิทธิ์ตำแหน่งของแอปนี้ในการตั้งค่าเครื่อง', true);
    } else if (e.code === 2) {
      showNotice('warn', 'ยังไม่พบสัญญาณ GPS ลองออกไปที่โล่ง และเปิดตำแหน่งแบบความแม่นยำสูงในการตั้งค่าเครื่อง');
    } else {
      showNotice('warn', 'รอสัญญาณ GPS นานกว่าปกติ กำลังลองต่อ');
    }
  }

  function startSim() {
    let k = 0, lat = 13.7563, lon = 100.5018;
    const heading = 20 * Math.PI / 180;
    function step() {
      k++;
      const kmh = Math.max(0, SIM_TOP * 0.48 + SIM_TOP * 0.52 * Math.sin(k / 10 - 1.5));
      const d = kmh / 3.6;
      lat += d * Math.cos(heading) / 111320;
      lon += d * Math.sin(heading) / (111320 * Math.cos(lat * Math.PI / 180));
      handleFix({ lat: lat, lon: lon, acc: 6 + Math.random() * 4, speed: kmh / 3.6, t: Date.now() });
    }
    step();
    simTimer = setInterval(step, 1000);
  }

  async function requestWake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* ignore */ }
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) { /* ignore */ }
    wakeLock = null;
  }

  function start() {
    if (running) return;
    if (!SIM) {
      if (!('geolocation' in navigator)) { showNotice('err', 'เบราว์เซอร์นี้ไม่รองรับ GPS'); return; }
      if (!window.isSecureContext) {
        showNotice('err', 'เบราว์เซอร์อนุญาตให้ใช้ตำแหน่งเฉพาะหน้าที่เปิดผ่านลิงก์ https เท่านั้น ให้โฮสต์ไฟล์นี้แล้วเปิดจากลิงก์ https');
        return;
      }
    }
    hideNotice();
    running = true; hasFix = false; trip.last = null; trip.hist = [];
    tickAt = performance.now();
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC && !audioCtx) audioCtx = new AC();
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* ignore */ }
    requestWake();
    if (SIM) startSim();
    else watchId = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
    updateUI();
    render();
  }

  function stop() {
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (simTimer !== null) { clearInterval(simTimer); simTimer = null; }
    running = false; hasFix = false;
    trip.disp = 0; trip.last = null; trip.hist = [];
    releaseWake();
    updateUI();
    render();
  }

  function resetTrip() {
    trip = createTrip();
    elapsed = 0; tickAt = performance.now();
    if (!running) hasFix = false;
    updateUI();
    render();
  }

  setInterval(() => {
    if (!running) return;
    const now = performance.now();
    elapsed += (now - tickAt) / 1000;
    tickAt = now;
    el.time.textContent = fmtTime(elapsed);
  }, 500);

  // GPS follows the app: it starts when the app opens or comes back and stops when the app is left.
  // The Android wrapper calls these two when the activity stops / starts; visibilitychange covers browsers.
  // The trip totals stay in memory, so a quick switch to another app does not lose them.
  function pauseGps() { if (running) stop(); }
  function resumeGps() { if (!running) start(); }
  window.motoGpsPause = pauseGps;
  window.motoGpsResume = resumeGps;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') pauseGps();
    else resumeGps();
  });
  // browsers keep the alert sound muted until the first touch
  document.addEventListener('pointerdown', () => {
    try { if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) { /* ignore */ }
  }, { passive: true });

  // ---------- share ----------
  function tripSummary() {
    const km = trip.dist / 1000;
    return 'ไมล์ GPS\n' +
      'ระยะทาง ' + (km < 10 ? km.toFixed(2) : km.toFixed(1)) + ' กม.\n' +
      'เวลา ' + fmtTime(elapsed) + '\n' +
      'ความเร็วเฉลี่ย ' + Math.round(avgKmh(trip)) + ' กม./ชม.\n' +
      'ความเร็วสูงสุด ' + Math.round(trip.max) + ' กม./ชม.';
  }
  async function shareTrip() {
    const text = tripSummary();
    try {
      if (window.AndroidBridge && window.AndroidBridge.share) { window.AndroidBridge.share(text); return; }
      if (navigator.share) { await navigator.share({ text: text }); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        flashNotice('คัดลอกสรุปทริปแล้ว');
        return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return;
    }
    flashNotice('แชร์ไม่ได้บนเครื่องนี้');
  }

  // ---------- controls ----------
  el.retry.addEventListener('click', resumeGps);
  el.reset.addEventListener('click', resetTrip);
  el.share.addEventListener('click', shareTrip);
  el.gauge.addEventListener('click', nextColor);

  // ---------- init ----------
  applyColor();
  drawStatic();
  updateUI();
  render();
  if (document.visibilityState !== 'hidden') start();   // start right away, no button
})();
</script>
</body>
</html>
