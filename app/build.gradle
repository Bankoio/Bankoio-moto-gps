plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bankoio.motogps'
    compileSdk 34

    defaultConfig {
        applicationId 'com.bankoio.motogps'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebViewAssetLoader serves the bundled page from https://appassets.androidplatform.net,
    // which counts as a secure context, so navigator.geolocation works inside the WebView.
    implementation 'androidx.webkit:webkit:1.11.0'
}
